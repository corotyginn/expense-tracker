<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
    <script src="/static/app.js" defer></script>
</head>
<body>
    <h1>Трекер расходов</h1>

    <div class="summary">
        <div class="card">
            <span class="label">Всего потрачено</span>
            <span id="total" class="value">0 ₽</span>
        </div>
        <div class="card chart-card">
            <canvas id="chart"></canvas>
        </div>
    </div>

    <form id="expense-form">
        <input type="text" id="title" placeholder="Описание" required>
        <input type="number" id="amount" placeholder="Сумма" step="0.01" min="0.01" required>
        <select id="category">
            <option value="food">Еда</option>
            <option value="transport">Транспорт</option>
            <option value="housing">Жильё</option>
            <option value="entertainment">Развлечения</option>
            <option value="health">Здоровье</option>
            <option value="other" selected>Другое</option>
        </select>
        <button type="submit">Добавить</button>
    </form>

    <div id="filters">
        <button data-category="" class="active">Все</button>
        <button data-category="food">Еда</button>
        <button data-category="transport">Транспорт</button>
        <button data-category="housing">Жильё</button>
        <button data-category="entertainment">Развлечения</button>
        <button data-category="health">Здоровье</button>
        <button data-category="other">Другое</button>
    </div>

    <ul id="expense-list"></ul>
</body>
</html>
